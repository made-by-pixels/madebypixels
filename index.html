<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Text Transfer</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #qrcode img {
            margin: 0 auto;
            border: 8px solid white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full glass-card rounded-3xl shadow-2xl p-8 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">QR Link</h1>
            <p class="text-slate-500 text-sm">Transfer text to your phone instantly.</p>
        </div>

        <div class="space-y-4">
            <div class="relative">
                <textarea 
                    id="textInput" 
                    placeholder="Type or paste text here..." 
                    class="w-full h-32 p-4 text-slate-700 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all outline-none resize-none"
                ></textarea>
                <div id="charCount" class="absolute bottom-3 right-3 text-xs text-slate-400">0 chars</div>
            </div>

            <button 
                onclick="generateQR()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center space-x-2"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                </svg>
                <span>Generate QR Code</span>
            </button>
        </div>

        <div id="qrWrapper" class="hidden animate-in fade-in zoom-in duration-300">
            <div class="flex flex-col items-center space-y-4 pt-4 border-t border-slate-100">
                <div id="qrcode" class="p-2 bg-white rounded-xl shadow-inner"></div>
                <div class="text-center">
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-widest">Scan with your camera</p>
                </div>
            </div>
        </div>
        
        <div id="emptyState" class="text-center py-4">
            <p class="text-slate-400 text-sm italic">Ready when you are...</p>
        </div>
    </div>

    <script>
        const input = document.getElementById('textInput');
        const countDisplay = document.getElementById('charCount');
        const qrWrapper = document.getElementById('qrWrapper');
        const emptyState = document.getElementById('emptyState');
        const qrContainer = document.getElementById('qrcode');

        // Initialize QR object once
        let qrcode = new QRCode(qrContainer, {
            width: 240,
            height: 240,
            colorDark: "#1e293b",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Update char count as user types
        input.addEventListener('input', () => {
            countDisplay.innerText = `${input.value.length} chars`;
        });

        function generateQR() {
            const text = input.value.trim();
            
            if (!text) {
                // Shake animation for empty input
                input.classList.add('ring-2', 'ring-red-400');
                setTimeout(() => input.classList.remove('ring-2', 'ring-red-400'), 1000);
                return;
            }

            // Generate
            qrcode.clear();
            qrcode.makeCode(text);

            // Show UI elements
            emptyState.classList.add('hidden');
            qrWrapper.classList.remove('hidden');
            
            // Smooth scroll to QR on mobile
            if (window.innerWidth < 640) {
                window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: 'smooth'
                });
            }
        }
    </script>
</body>
</html>
